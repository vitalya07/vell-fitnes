<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vell-fitnes</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="vell-fitnes платформа для занятия фитнесом">
</head> 
<body>
    <div class="body__container">
        <header class="header">
            <div class="container">
                <div class="header__wrapper">
                    <a href="#" class="header__logo custom-logo">
                        <img src="assets/icons/logo.png" alt="логотип сайта" width="280" height="30" loading="lazy" class="custom-logo">
                    </a>
                    <div class="header__wrapper-end">
                        <div class="header__dillers">
                            <a href="#" class="header__dillers-link">Для дилеров</a>
                            <a href="#" class="header__dillers-partner">Become a Partner </a>
                        </div>
                        <div class="header__feedback">
                            <a href="#" class="header__feedback-phone">+7 (800) 000-00-00</a>
                            <button class="header__feedback-btn modal__open">Заказать звонок</button>
                        </div>
                        <div class="header__user">
                            <span class="header__user-text">Войти</span>
                            <img src="assets/icons/profile-user.svg" alt="Пользователь" class="header__user-img" width="20" height="20" loading="lazy">
                        </div>
                    </div>
                  
                </div>                               
            </div>
            <div class="subheader">
                <div class="container">
                    <div class="subheader__wrapper">
                        <div class="subheader__searchs">
                            <button class="subheader__menu subheader__searchs-menu subheader__btn btn">
                                <img src="assets/icons/menu.svg" alt="vell-fitnes помощь с тренировками" width="16" height="16" loading="lazy" class="subheader__menu-img">
                                <div class="subheader__menu-text">Каталог</div>
                            </button>
                            <button class="subheader__searchs-search"><img src="assets/icons/search.svg" alt="Поиск по сайту" width="20" height="20" loading="lazy" class="subheader__searchs-search-icon"></button>
                        </div>
                       <nav class="subheader__nav">
                            <ul class="subheader__nav-list">
                                <li><a href="#">Бренды</a></li>
                                <li><a href="#">Сервис</a></li>
                                <li><a href="#">Услуги</a></li>
                                <li><a href="#">Поддержка</a></li>
                                <li><a href="#">О компании</a></li>
                                <li><a href="#">Блог</a></li>
                                <li><a href="#">Где купить</a></li>
                                <li><a href="#">Контакты</a></li>
                            </ul>
                       </nav>
                       <div class="subheader__elements">
                            <div class="subheader__elements-item subheader__elements-comparison">
                                <img src="assets/icons/comparison.svg" alt="Сравнение товаров" width="16" height="16" loading="lazy" class="subheader__elements-item--icon">
                                <span class="subheader__elements-item--count subheader__elements-comparison--count">1</span>
                            </div>
                            <div class="subheader__elements-item subheader__elements-favorites">
                                <img src="assets/icons/heart.svg" alt="Избранные товары" width="24" height="19" loading="lazy" class="subheader__elements-item--icon">
                                <span class="subheader__elements-item--count subheader__elements-favorites--count">1</span>
                            </div>
                            <div class="subheader__elements-item subheader__elements-cart">
                                <img src="assets/icons/cart.svg" alt="Корзина" width="21" height="24" loading="lazy" class="subheader__elements-item--icon">
                                <span class="subheader__elements-item--count subheader__elements-cart--count">1</span>
                            </div>
                       </div>
                    </div>  
                </div>
                               
            </div> 
            <div class="header__catalog">
                <div class="container">
                    <div class="header__catalog-wrapper">
                        <a href="#" class="header__catalog-link"><div class="header__catalog-link--text">Для дома</div> <img src="assets/icons/arrow-top.svg" alt="стрелка вниз" class="header__catalog-link--img"> </a>
                        <div class="header__catalog-chert"></div>
                        <a href="#" class="header__catalog-link"><div class="header__catalog-link--text">Для фитнес клубов</div> <img src="assets/icons/arrow-top.svg" alt="стрелка вниз" class="header__catalog-link--img"> </a>
                    </div>
                   
                </div>
            </div>
        </header>
        <main class="content">
    
        </main>
    </div>
</body>
</html>
